<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#285e49" />
    <title>Student List</title>
    <script>
      try {
        const saved = localStorage.getItem('student-list-theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This React application needs JavaScript enabled to display students.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
