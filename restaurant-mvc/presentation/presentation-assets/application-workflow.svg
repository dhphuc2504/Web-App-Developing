<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Application workflow for customers, chefs and administrators" viewBox="0 0 1100 370" style="font-family:Arial,sans-serif;fill:#35291f;background:#f4ecdb"><title>Application workflow for customers, chefs and administrators</title><desc>Customers enter and browse the menu. Chefs authenticate to manage dishes and recipes, and separately record usage or waste. Administrators manage staff and catalog data, and separately receive stock or correct counts. Stock actions create ledger history.</desc><defs><marker id="workflow-application-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#803d2d"/></marker></defs><text x="10" y="53" font-size="22" font-weight="600" fill="#803d2d">Customer</text><text x="10" y="80" font-size="16" fill="#685643">Public access</text><rect x="145" y="20" width="160" height="82" rx="3" fill="#fffaf0" stroke="#b79b78"/><text x="225" y="52" text-anchor="middle" font-size="20" font-weight="600">Entrance</text><text x="225" y="80" text-anchor="middle" font-size="16" fill="#685643">Shoji door</text><path d="M305 61 L335 61" fill="none" stroke="#803d2d" stroke-width="2" marker-end="url(#workflow-application-arrow)"/><rect x="335" y="20" width="160" height="82" rx="3" fill="#fffaf0" stroke="#b79b78"/><text x="415" y="52" text-anchor="middle" font-size="20" font-weight="600">House</text><text x="415" y="80" text-anchor="middle" font-size="16" fill="#685643">Room directory</text><path d="M495 61 L525 61" fill="none" stroke="#803d2d" stroke-width="2" marker-end="url(#workflow-application-arrow)"/><rect x="525" y="20" width="160" height="82" rx="3" fill="#fffaf0" stroke="#b79b78"/><text x="605" y="52" text-anchor="middle" font-size="20" font-weight="600">Menu book</text><text x="605" y="80" text-anchor="middle" font-size="16" fill="#685643">Search / sort</text><path d="M685 61 L715 61" fill="none" stroke="#803d2d" stroke-width="2" marker-end="