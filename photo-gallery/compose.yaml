services:
  gallery:
    build:
      context: .
      target: gallery
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://gallery:gallery-local@db:5432/gallery}
      MINIO_ENDPOINT: http://objects:9000
      MINIO_USER: ${MINIO_USER:-stillroom}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-stillroom-local-demo}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      objects:
        condition: service_started
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gallery
      POSTGRES_DB: gallery
      POSTGRES_PASSWORD: gallery-local
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U gallery"]
      interval: 3s
      timeout: 3s
      retries: 20
  objects:
    build:
      context: .
      target: object-server
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-stillroom}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-stillroom-local-demo}
    volumes:
      - photographs:/data
volumes:
  database:
  photographs:
